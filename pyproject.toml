[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redteam-harness"
version = "0.1.0"
description = "Offline-first red-team evaluation harness for tool-using LLM agents: attack suite, layered defenses, policy-as-code, and NIST AI RMF / MITRE ATLAS mapped reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anthony Blow" }]
requires-python = ">=3.11"
dependencies = []  # core harness is standard-library only

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
arh = "arh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
